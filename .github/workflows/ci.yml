name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit and cargo-deny
        run: cargo install --locked cargo-audit cargo-deny
      - run: cargo audit
      - run: cargo deny check
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No committed env or key files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)|\.(pem|key|jks|keystore)$' | grep -v '\.env\.example$'; then
            echo "Secret-like files are committed"; exit 1; fi
      - name: No banned marketing words in user-facing text
        run: |
          # Docs that quote the banned list are excluded.
          if grep -rniE '\b(anonymous|untraceable|military[ -]grade|no logs|leaves no trace)\b' \
              README.md android web-receiver desktop 2>/dev/null; then
            echo "Banned marketing wording found"; exit 1; fi
      - name: No Google services in Android sources (once present)
        run: |
          if grep -rniE 'com\.google\.(firebase|android\.gms|mlkit)|play-services|firebase-|mlkit' \
              android 2>/dev/null; then
            echo "Forbidden Google dependency found"; exit 1; fi
