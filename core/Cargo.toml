[package]
name = "ember-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
dryoc = "2.0.0"
ember-protocol = { version = "0.0.1", path = "../protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.8"
subtle = "2.6.1"
thiserror = "2.0.21"
zeroize = { version = "1.9.1", features = ["derive"] }

[features]
default = []
test-hooks = []

[dev-dependencies]
ember-core = { path = ".", features = ["test-hooks"] }
